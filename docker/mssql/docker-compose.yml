name: {{PROJECT_NAME}}

# Microsoft SQL Server 2022 (Developer Edition, 비상업적 무료)
# ACCEPT_EULA=Y 로 Microsoft EULA에 동의합니다.
# SA 비밀번호는 대문자·소문자·숫자·특수문자 포함 8자 이상이어야 합니다.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: {{PROJECT_NAME}}-mssql
    restart: unless-stopped
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Changeme1!"
      MSSQL_PID: Developer
    volumes:
      - {{PROJECT_NAME}}-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Changeme1!' -No -Q 'SELECT 1' > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  {{PROJECT_NAME}}-mssql-data:
