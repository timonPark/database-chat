name: {{PROJECT_NAME}}

services:
  mysql:
    image: mysql:8.0
    container_name: {{PROJECT_NAME}}-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: changeme
    volumes:
      - {{PROJECT_NAME}}-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchangeme"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  {{PROJECT_NAME}}-mysql-data:
