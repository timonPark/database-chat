<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Mongo Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: row;
    }

    /* 사이드바 — Session 리스트 */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background: #141427;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #new-session-btn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
      background: #1a2a4a;
      color: #b0d4f0;
      font-size: 0.84rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #new-session-btn:hover { background: #2a3a5a; color: #e0eeff; }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-item {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      transition: background 0.1s;
    }
    .session-item:hover { background: #1a2a4a; }
    .session-item.active { background: #1a3a5a; }

    .session-title {
      font-size: 0.86rem;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-meta {
      display: flex;
      gap: 8px;
      font-size: 0.72rem;
      color: #5a7fa0;
      font-family: monospace;
    }

    .session-attach-badge {
      color: #7ab3e0;
    }

    .session-hover-menu {
      position: absolute;
      right: 6px;
      top: 6px;
      display: none;
      gap: 2px;
      background: #0d1a2e;
      border-radius: 6px;
      padding: 2px;
    }
    .session-item:hover .session-hover-menu { display: flex; }

    .session-menu-btn {
      background: none;
      border: none;
      color: #7ab3e0;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .session-menu-btn:hover { background: #1a3a5a; color: #e0e0e0; }

    /* 메인 영역 — 기존 header + chat-window + input-area 를 감싸는 flex 컨테이너 */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 10px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 과거 Session 안내 배너 */
    #past-session-banner {
      padding: 8px 20px;
      background: #2a3a1a;
      border-bottom: 1px solid #3a4a2a;
      color: #d0e0b0;
      font-size: 0.82rem;
      text-align: center;
      flex-shrink: 0;
    }

    /* Export 칩 */
    .export-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .export-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #1a3a5a;
      border: 1px solid #2a4a6a;
      color: #b0d4f0;
      font-size: 0.78rem;
      cursor: pointer;
      position: relative;
      transition: background 0.1s;
    }
    .export-chip:hover { background: #2a4a6a; }

    .export-chip-delete {
      display: none;
      background: none;
      border: none;
      color: #d08080;
      cursor: pointer;
      padding: 0 2px 0 4px;
      font-size: 0.9rem;
      line-height: 1;
    }
    .export-chip:hover .export-chip-delete { display: inline; }
    .export-chip-delete:hover { color: #ff5a5a; }

    /* 토스트 */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f3460;
      color: #e0eeff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.86rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 2000;
    }
    #toast.visible { opacity: 1; }

    /* Attachment 복원 — table-ref 안내 */
    .attachment-ref {
      padding: 10px 12px;
      background: #1a2a3a;
      border: 1px dashed #2a4a6a;
      border-radius: 8px;
      color: #8ab0d0;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    .header-left h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header-left .updated-at {
      font-size: 0.72rem;
      color: #5a7fa0;
      margin-top: 2px;
    }

    #table-info-btn {
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
      background: transparent;
      color: #7ab3e0;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    #table-info-btn:hover { background: #1a3a5a; color: #b0d4f0; }

    .header-actions { display: flex; gap: 8px; }

    #erd-btn {
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
      background: transparent;
      color: #7ab3e0;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    #erd-btn:hover:not(:disabled) { background: #1a3a5a; color: #b0d4f0; }
    #erd-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #erd-modal .modal-box { width: min(96vw, 1400px); max-height: 92vh; }
    #erd-canvas {
      flex: 1;
      overflow: auto;
      background: #0d1729;
      padding: 12px;
    }
    #erd-canvas svg { max-width: none; height: auto; }
    .erd-empty { padding: 24px; color: #7ab3e0; text-align: center; font-size: 0.9rem; }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      width: min(780px, 94vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #0f3460;
      font-size: 0.95rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: #5a7fa0;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close:hover { color: #e0e0e0; background: #2a3a5a; }

    .modal-search {
      flex-shrink: 0;
      padding: 10px 20px;
      border-bottom: 1px solid #0f3460;
      background: #16213e;
    }

    .modal-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.85rem;
      outline: none;
    }

    .modal-search input:focus { border-color: #4a90d9; }

    .modal-no-result {
      padding: 20px;
      text-align: center;
      color: #4a7a9b;
      font-size: 0.85rem;
    }

    .modal-body {
      overflow-y: auto;
      padding: 20px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .modal-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
    }

    .modal-body th, .modal-body td {
      border: 1px solid #2a3a5a;
      padding: 7px 12px;
      text-align: left;
    }

    .modal-body th {
      background: #1a2a4a;
      color: #a0c4e0;
      font-weight: 600;
    }

    .modal-body tr:nth-child(even) td { background: #1a1f35; }

    .modal-body code {
      background: #0f1a2e;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #7ab3e0;
    }

    .modal-body h1, .modal-body h2, .modal-body h3 {
      color: #a0c4e0;
      margin: 14px 0 6px;
    }

    .modal-body p { margin: 6px 0; }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-wrapper {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble-time {
      font-size: 0.70rem;
      color: #4a7a9b;
      font-family: monospace;
      padding: 0 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
    }

    .bubble.user {
      background: #0f3460;
      border-bottom-right-radius: 4px;
      color: #ddeeff;
    }

    .bubble.assistant {
      background: #2a2a3e;
      border-bottom-left-radius: 4px;
      color: #e0e0e0;
    }

    .bubble.progress {
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      white-space: normal;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #7ab3e0;
    }

    .progress-step .step-time {
      font-family: monospace;
      font-size: 0.75rem;
      color: #4a7a9b;
      flex-shrink: 0;
    }

    .progress-step.done {
      color: #5a8a5a;
    }

    .progress-step .spinner {
      width: 10px;
      height: 10px;
      border: 2px solid #4a90d9;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    .progress-step.done .spinner {
      border: none;
      animation: none;
      width: 10px;
      text-align: center;
    }

    .progress-step.done .spinner::after {
      content: '✓';
      font-size: 0.8rem;
      color: #5a8a5a;
    }

    .progress-log {
      margin-left: 17px;
      background: #1a1a2e;
      border-left: 2px solid #0f3460;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.78rem;
      color: #8899bb;
      white-space: pre;
      overflow-x: auto;
    }

    .result-divider {
      border: none;
      border-top: 1px solid #2a3a5a;
      margin: 6px 0 4px;
    }

    .result-text {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #e0e0e0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result-data {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.78rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #1a2a4a;
      color: #a0c4e0;
      border: 1px solid #2a4a6a;
    }

    .badge.partial {
      background: #3a2f1a;
      color: #d9c07a;
      border-color: #5a4a2a;
    }

    .empty-card {
      padding: 16px 18px;
      background: #1a2a3a;
      border: 1px solid #2a4a6a;
      border-radius: 8px;
      color: #7ab3e0;
      font-size: 0.88rem;
      text-align: center;
    }

    .result-table-wrap {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 480px;
      border: 1px solid #2a3a5a;
      border-radius: 8px;
      background: #0f1a2e;
    }

    table.result-table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      font-size: 0.82rem;
    }

    table.result-table th,
    table.result-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #1a2a4a;
      border-right: 1px solid #1a2a4a;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    table.result-table th {
      position: sticky;
      top: 0;
      background: #1a2a4a;
      color: #b0d4f0;
      font-weight: 600;
      font-size: 0.78rem;
      z-index: 1;
    }

    table.result-table th.unmapped {
      background: #2a2a3a;
      color: #8899aa;
    }

    table.result-table th .th-key {
      display: block;
      font-family: monospace;
      font-size: 0.68rem;
      color: #6a8ab0;
      font-weight: normal;
      margin-top: 2px;
    }

    table.result-table th.unmapped .th-key { color: #667788; }

    table.result-table tr:nth-child(even) td { background: #131e33; }
    table.result-table tr:hover td { background: #1a2540; }

    .cell-oid, .cell-mono {
      font-family: monospace;
      font-size: 0.78rem;
      color: #a0c4e0;
    }

    .cell-bool-t { color: #6ab86a; }
    .cell-bool-f { color: #b86a6a; }
    .cell-null { color: #556; }

    .cell-nested {
      background: none;
      border: none;
      padding: 0;
      color: #7ab3e0;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
    }

    .cell-nested:hover { text-decoration: underline; }

    .nested-json {
      display: none;
      margin-top: 4px;
      padding: 6px 8px;
      background: #0a1220;
      border: 1px solid #1a2a4a;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #a0c4e0;
      white-space: pre;
      max-height: 220px;
      overflow: auto;
    }

    .nested-json.open { display: block; }

    .truncate-notice {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      background: #1e2d1e;
      border: 1px solid #3a5a3a;
      color: #7ab87a;
      font-size: 0.78rem;
    }

    .result-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      background: transparent;
      color: #5a7fa0;
      cursor: pointer;
      font-size: 0.75rem;
      transition: color 0.15s, border-color 0.15s;
    }

    .action-btn:hover { color: #a0c4e0; border-color: #4a7a9b; }
    .action-btn.copied { color: #5a8a5a; border-color: #5a8a5a; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #input-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 16px 12px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      position: sticky;
      bottom: 0;
    }

    #limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #limit-label {
      font-size: 0.75rem;
      color: #4a7a9b;
    }

    #limit-select {
      background: #1a1a2e;
      border: 1px solid #1a3a5a;
      border-radius: 6px;
      color: #7ab3e0;
      font-size: 0.75rem;
      padding: 3px 8px;
      outline: none;
      cursor: pointer;
    }

    #limit-select:focus { border-color: #4a90d9; }

    #limit-custom {
      width: 72px;
      background: #1a1a2e;
      border: 1px solid #1a3a5a;
      border-radius: 6px;
      color: #7ab3e0;
      font-size: 0.75rem;
      padding: 3px 8px;
      outline: none;
    }

    #limit-custom:focus { border-color: #4a90d9; }

    #input-row {
      display: flex;
      gap: 8px;
    }

    #input-row #user-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 22px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.92rem;
      outline: none;
      resize: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }

    #input-row #user-input:focus { border-color: #4a90d9; }

    #send-btn {
      padding: 0 18px;
      border-radius: 22px;
      border: none;
      background: #4a90d9;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { background: #357abd; }
    #send-btn:disabled { background: #2a4a6a; cursor: not-allowed; }

    #stop-btn {
      padding: 0 18px;
      border-radius: 22px;
      border: none;
      background: #8b2020;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
      display: none;
    }

    #stop-btn:hover { background: #a83232; }

    @media (max-width: 480px) {
      .msg-wrapper { max-width: 90%; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <div id="sidebar-header">
      <button id="new-session-btn">+ 새 Session</button>
    </div>
    <div id="session-list"></div>
  </aside>

  <div id="main-area">
    <header>
      <div class="header-left">
        <h1>Gemini Mongo Chat</h1>
        <div class="updated-at" id="updated-at"></div>
      </div>
      <div class="header-actions">
        <button id="erd-btn" title="먼저 pnpm run erd 를 실행하세요" disabled>ERD 보기</button>
        <button id="table-info-btn">테이블 정보</button>
      </div>
    </header>

    <div id="past-session-banner" style="display:none">이전 Session 입니다 — 새 질의는 새 Session 에서 시작됩니다</div>

  <div id="erd-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <span>ERD (컬렉션 관계 다이어그램)</span>
        <button class="modal-close" id="erd-modal-close">✕</button>
      </div>
      <div id="erd-canvas"></div>
    </div>
  </div>

  <div id="table-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <span>테이블 정보</span>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-search">
        <input type="text" id="modal-search-input" placeholder="컬렉션명 또는 설명으로 검색...">
      </div>
      <div class="modal-body" id="modal-content"></div>
    </div>
  </div>

  <div id="chat-window"></div>

  <div id="input-area">
    <div id="limit-row">
      <span id="limit-label">최대 조회 건수</span>
      <select id="limit-select">
        <option value="20">20건</option>
        <option value="50">50건</option>
        <option value="100">100건</option>
        <option value="200">200건</option>
        <option value="500">500건</option>
        <option value="custom">직접 입력</option>
      </select>
      <input type="number" id="limit-custom" min="1" placeholder="건수" style="display:none">
    </div>
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="질의를 입력하세요. 과거 결과의 구조만 LLM 이 참조하며 데이터 값은 보지 못합니다"></textarea>
      <button id="stop-btn">중지</button>
      <button id="send-btn">전송</button>
    </div>
  </div>
  </div>

  <div id="toast"></div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');
    const sidebarList = document.getElementById('session-list');
    const newSessionBtn = document.getElementById('new-session-btn');
    const pastSessionBanner = document.getElementById('past-session-banner');
    const toastEl = document.getElementById('toast');

    let currentRequestId = null;

    // 활성 세션이 "최신 Session" 과 다를 때만 과거 열람 모드로 간주.
    // 신규 질의는 최신 Session 에서만 수용 — 과거 열람 중 입력 시 자동 신규 Session + 토스트 (에픽 #232 결정 요약 3번).
    const state = {
      sessions: [],
      currentSessionId: null,
      exportsBySessionId: new Map(),
    };

    const isViewingPast = () => state.currentSessionId != null
      && state.currentSessionId !== state.sessions[0]?.id;

    // 2xx 또는 204 를 성공으로 판정 — fetch 는 비-2xx 를 throw 하지 않으므로 소비자 쪽 가드.
    const okOrNoContent = (res) => res.ok || res.status === 204;

    const api = {
      listSessions: () => fetch('/sessions').then(r => r.json()),
      createSession: (firstQuery) => fetch('/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstQuery }),
      }).then(r => r.json()),
      renameSession: (id, title) => fetch(`/sessions/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      }),
      deleteSession: (id) => fetch(`/sessions/${id}`, { method: 'DELETE' }),
      listMessages: (id) => fetch(`/sessions/${id}/messages`).then(r => r.json()),
      listExports: (id) => fetch(`/sessions/${id}/exports`).then(r => r.json()),
      deleteExport: (id) => fetch(`/exports/${id}`, { method: 'DELETE' }),
    };

    // 전역 단일 타이머. 연쇄 호출 시 이전 메시지가 즉시 교체되고 visible 상태는 유지 — 짧은 간격 알림은 마지막 것만 보임 (의도).
    let toastTimer = null;
    function showToast(text, durationMs = 2200) {
      toastEl.textContent = text;
      toastEl.classList.add('visible');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), durationMs);
    }

    // ── 상대시각 ("5분 전") ─────────────────────────────────────────────────────
    function formatRelative(ts) {
      const diffMs = Date.now() - ts;
      const sec = Math.floor(diffMs / 1000);
      if (sec < 60) return '방금';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}분 전`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr}시간 전`;
      const day = Math.floor(hr / 24);
      if (day < 7) return `${day}일 전`;
      return new Date(ts).toISOString().slice(0, 10);
    }

    function formatBytes(n) {
      if (n < 1024) return `${n}B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)}KB`;
      return `${(n / 1024 / 1024).toFixed(1)}MB`;
    }

    // ── 사이드바 렌더 ───────────────────────────────────────────────────────────
    function renderSidebar() {
      sidebarList.innerHTML = '';
      for (const s of state.sessions) {
        const item = document.createElement('div');
        item.className = 'session-item' + (s.id === state.currentSessionId ? ' active' : '');
        item.dataset.id = s.id;

        const title = document.createElement('div');
        title.className = 'session-title';
        title.textContent = s.title || '(제목 없음)';
        item.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'session-meta';
        const t = document.createElement('span');
        t.textContent = formatRelative(s.updatedAt);
        meta.appendChild(t);
        const expCount = (state.exportsBySessionId.get(s.id) || []).length;
        if (expCount > 0) {
          const b = document.createElement('span');
          b.className = 'session-attach-badge';
          b.textContent = `📎 ${expCount}`;
          meta.appendChild(b);
        }
        item.appendChild(meta);

        const menu = document.createElement('div');
        menu.className = 'session-hover-menu';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'session-menu-btn';
        renameBtn.textContent = '✎';
        renameBtn.title = '리네임';
        renameBtn.onclick = (e) => { e.stopPropagation(); handleRename(s); };

        const dlBtn = document.createElement('button');
        dlBtn.className = 'session-menu-btn';
        dlBtn.textContent = '⇩';
        dlBtn.title = 'JSON 내보내기';
        dlBtn.onclick = (e) => { e.stopPropagation(); handleExportJson(s); };

        const delBtn = document.createElement('button');
        delBtn.className = 'session-menu-btn';
        delBtn.textContent = '✕';
        delBtn.title = '삭제';
        delBtn.onclick = (e) => { e.stopPropagation(); handleDelete(s); };

        menu.appendChild(renameBtn);
        menu.appendChild(dlBtn);
        menu.appendChild(delBtn);
        item.appendChild(menu);

        item.onclick = () => selectSession(s.id);
        sidebarList.appendChild(item);
      }
    }

    async function handleRename(session) {
      const next = prompt('새 Session 제목', session.title || '');
      if (next == null) return;
      const trimmed = next.trim();
      if (!trimmed || trimmed === session.title) return;
      const res = await api.renameSession(session.id, trimmed);
      if (!okOrNoContent(res)) { showToast('리네임 실패'); return; }
      session.title = trimmed;
      renderSidebar();
    }

    async function handleDelete(session) {
      if (!confirm(`Session "${session.title}" 을 삭제할까요?\n(연결된 메시지·Export 도 함께 삭제됩니다.)`)) return;
      const res = await api.deleteSession(session.id);
      if (!okOrNoContent(res)) { showToast('삭제 실패'); return; }
      state.sessions = state.sessions.filter(x => x.id !== session.id);
      state.exportsBySessionId.delete(session.id);
      if (state.currentSessionId === session.id) {
        state.currentSessionId = state.sessions[0]?.id ?? null;
        if (state.currentSessionId) await selectSession(state.currentSessionId);
        else clearChatWindow();
      }
      renderSidebar();
    }

    function handleExportJson(session) {
      // 저장된 메시지와 Export 메타를 JSON 번들로 로컬 다운로드.
      Promise.all([api.listMessages(session.id), api.listExports(session.id)])
        .then(([messages, exports]) => {
          const bundle = { session, messages, exports };
          const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `session-${session.id}.json`;
          a.click();
          URL.revokeObjectURL(a.href);
        })
        .catch(() => showToast('JSON 내보내기 실패'));
    }

    async function selectSession(id) {
      state.currentSessionId = id;
      pastSessionBanner.style.display = isViewingPast() ? '' : 'none';
      renderSidebar();
      await restoreSession(id);
    }

    async function createNewSession(firstQuery) {
      const created = await api.createSession(firstQuery ?? '');
      await refreshSessions();
      state.currentSessionId = created.id;
      pastSessionBanner.style.display = 'none';
      renderSidebar();
      clearChatWindow();
      return created.id;
    }

    async function refreshSessions() {
      const list = await api.listSessions();
      state.sessions = list;
      // Export 목록은 뱃지에 쓰임 — 열려있는 세션 외는 lazy, 세션 리스트 전환 시 캐시 재사용.
      await Promise.all(list.map(async s => {
        if (!state.exportsBySessionId.has(s.id)) {
          try {
            const exps = await api.listExports(s.id);
            state.exportsBySessionId.set(s.id, exps);
          } catch { state.exportsBySessionId.set(s.id, []); }
        }
      }));
    }

    function clearChatWindow() {
      chatWindow.innerHTML = '';
    }

    // ── Session 복원 ────────────────────────────────────────────────────────────
    async function restoreSession(id) {
      clearChatWindow();
      const [messages, exports] = await Promise.all([
        api.listMessages(id),
        api.listExports(id),
      ]);
      state.exportsBySessionId.set(id, exports);
      const exportsByMessageId = new Map();
      for (const e of exports) {
        if (!e.messageId) continue;
        if (!exportsByMessageId.has(e.messageId)) exportsByMessageId.set(e.messageId, []);
        exportsByMessageId.get(e.messageId).push(e);
      }
      for (const m of messages) {
        renderRestoredMessage(m, exportsByMessageId.get(m.id) || []);
      }
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function renderRestoredMessage(m, msgExports) {
      if (m.role === 'user') {
        const w = document.createElement('div');
        w.className = 'msg-wrapper user';
        const b = document.createElement('div');
        b.className = 'bubble user';
        b.innerHTML = escapeHtml(m.text);
        const t = document.createElement('div');
        t.className = 'bubble-time';
        t.textContent = new Date(m.createdAt).toTimeString().slice(0, 8);
        w.appendChild(b);
        w.appendChild(t);
        chatWindow.appendChild(w);
        return;
      }
      const w = document.createElement('div');
      w.className = 'msg-wrapper assistant';
      const b = document.createElement('div');
      b.className = 'bubble assistant';
      renderAssistantBody(b, m, msgExports);
      if (msgExports.length > 0) renderExportChips(b, msgExports);
      const t = document.createElement('div');
      t.className = 'bubble-time';
      t.textContent = new Date(m.createdAt).toTimeString().slice(0, 8);
      w.appendChild(b);
      w.appendChild(t);
      chatWindow.appendChild(w);
    }

    // 복원된 assistant 바디: attachment 형태별 분기 (data 포함 / 메타만 / text 만).
    function renderAssistantBody(b, m, msgExports) {
      const att = m.attachments;
      if (att && Array.isArray(att.data)) {
        renderResultData(b, {
          count: att.rowCount ?? att.data.length,
          data: att.data,
          columns: att.columns ?? [],
          dbTimeMs: att.dbTimeMs ?? 0,
        }, null);
        return;
      }
      if (att && typeof att.rowCount === 'number') {
        const ref = document.createElement('div');
        ref.className = 'attachment-ref';
        const cols = Array.isArray(att.columns) && att.columns.length > 0
          ? ` · columns: ${att.columns.map(c => c.label || c.key || c).join(', ')}`
          : '';
        const promoted = msgExports.some(e => e.messageId === m.id);
        ref.textContent = `결과: ${att.rowCount}행${cols}${promoted ? ' (엑셀로 저장됨 — 아래 📎 재다운로드)' : ''}`;
        b.appendChild(ref);
        return;
      }
      if (m.text) {
        const r = document.createElement('div');
        r.className = 'result-text';
        r.textContent = m.text;
        b.appendChild(r);
      }
    }

    function renderExportChips(parent, exports) {
      const wrap = document.createElement('div');
      wrap.className = 'export-chips';
      for (const e of exports) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'export-chip';
        const label = document.createElement('span');
        const sizeText = formatBytes(e.fileSize);
        const rowText = e.rowCount != null ? `, ${e.rowCount}행` : '';
        label.textContent = `📎 ${e.fileName} (${sizeText}${rowText})`;
        chip.appendChild(label);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'export-chip-delete';
        del.textContent = '×';
        del.title = '삭제';
        del.onclick = (ev) => {
          ev.stopPropagation();
          handleDeleteExport(e, chip);
        };
        chip.appendChild(del);

        chip.onclick = () => { window.location.href = `/exports/${e.id}/download`; };
        wrap.appendChild(chip);
      }
      parent.appendChild(wrap);
    }

    async function handleDeleteExport(exp, chipEl) {
      if (!confirm(`"${exp.fileName}" 을 삭제할까요?`)) return;
      const res = await api.deleteExport(exp.id);
      if (!okOrNoContent(res)) { showToast('Export 삭제 실패'); return; }
      chipEl.remove();
      const list = state.exportsBySessionId.get(exp.sessionId) || [];
      state.exportsBySessionId.set(exp.sessionId, list.filter(x => x.id !== exp.id));
      renderSidebar();
    }

    // ── 초기 로드 ───────────────────────────────────────────────────────────────
    (async () => {
      await refreshSessions();
      if (state.sessions.length > 0) {
        await selectSession(state.sessions[0].id);
      } else {
        state.currentSessionId = null;
        state.isViewingPast = false;
        renderSidebar();
      }
    })();

    newSessionBtn.addEventListener('click', async () => {
      await createNewSession('');
    });

    // 테이블 정보 모달
    const tableModal = document.getElementById('table-modal');
    const modalContent = document.getElementById('modal-content');
    const modalSearchInput = document.getElementById('modal-search-input');

    function filterModalRows(q) {
      const term = q.trim().toLowerCase();

      // 모든 요소 초기화
      modalContent.querySelectorAll('table, tr, h1, h2, h3, h4, p, hr')
        .forEach(el => el.style.display = '');

      const noResult = modalContent.querySelector('.modal-no-result');
      if (!term) {
        if (noResult) noResult.style.display = 'none';
        return;
      }

      let totalVisible = 0;

      modalContent.querySelectorAll('table').forEach(table => {
        const rows = table.querySelectorAll('tbody tr');
        let visibleCount = 0;
        rows.forEach(row => {
          const match = row.textContent.toLowerCase().includes(term);
          row.style.display = match ? '' : 'none';
          if (match) visibleCount++;
        });

        // 매칭 행이 없으면 테이블과 앞쪽 제목/단락도 숨김
        if (visibleCount === 0) {
          table.style.display = 'none';
          let el = table.previousElementSibling;
          while (el && el.tagName !== 'TABLE') {
            el.style.display = 'none';
            el = el.previousElementSibling;
          }
        } else {
          totalVisible += visibleCount;
        }
      });

      let nr = modalContent.querySelector('.modal-no-result');
      if (totalVisible === 0) {
        if (!nr) {
          nr = document.createElement('div');
          nr.className = 'modal-no-result';
          modalContent.appendChild(nr);
        }
        nr.textContent = `"${q}" 에 해당하는 컬렉션이 없습니다.`;
        nr.style.display = '';
      } else if (nr) {
        nr.style.display = 'none';
      }
    }

    document.getElementById('table-info-btn').addEventListener('click', async () => {
      if (!modalContent.innerHTML) {
        const res = await fetch('/meta/table-info');
        const { content } = await res.json();
        modalContent.innerHTML = marked.parse(content);
      }
      modalSearchInput.value = '';
      filterModalRows('');
      tableModal.style.display = 'flex';
      modalSearchInput.focus();
    });

    modalSearchInput.addEventListener('input', (e) => filterModalRows(e.target.value));

    // ── ERD 모달 ─────────────────────────────────────────────────────────────
    const erdBtn = document.getElementById('erd-btn');
    const erdModal = document.getElementById('erd-modal');
    const erdCanvas = document.getElementById('erd-canvas');
    let erdRendered = false;
    let erdContent = null;

    // Mermaid 초기화 (다크 테마)
    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        securityLevel: 'loose',
        maxTextSize: 500000,
        maxEdges: 2000,
        er: { useMaxWidth: false },
      });
    }

    // 로드 시 ERD 가용 여부 확인
    (async () => {
      try {
        const res = await fetch('/meta/erd');
        const data = await res.json();
        if (data.available && data.content) {
          erdContent = data.content;
          erdBtn.disabled = false;
          erdBtn.title = 'ERD 다이어그램 보기';
        } else {
          erdBtn.disabled = true;
          erdBtn.title = '먼저 pnpm run erd 를 실행하세요';
        }
      } catch (err) {
        erdBtn.disabled = true;
        erdBtn.title = 'ERD 데이터를 가져오지 못했습니다: ' + err.message;
      }
    })();

    erdBtn.addEventListener('click', async () => {
      if (erdBtn.disabled || !erdContent) return;
      erdModal.style.display = 'flex';
      if (erdRendered) return;
      erdCanvas.innerHTML = '<div class="erd-empty">렌더링 중... (엔티티가 많으면 최대 수십 초 걸릴 수 있습니다)</div>';
      try {
        const { svg } = await window.mermaid.render('erd-svg-' + Date.now(), erdContent);
        erdCanvas.innerHTML = svg;
        erdRendered = true;
        const svgEl = erdCanvas.querySelector('svg');
        if (svgEl && window.svgPanZoom) {
          svgEl.style.width = '100%';
          svgEl.style.height = '85vh';
          window.svgPanZoom(svgEl, {
            zoomEnabled: true,
            controlIconsEnabled: true,
            fit: true,
            center: true,
            minZoom: 0.1,
            maxZoom: 20,
          });
        }
      } catch (err) {
        erdCanvas.innerHTML = '<div class="erd-empty">ERD 렌더링 실패: ' + (err.message || err) + '</div>';
      }
    });

    document.getElementById('erd-modal-close').addEventListener('click', () => {
      erdModal.style.display = 'none';
    });
    erdModal.addEventListener('click', (e) => {
      if (e.target === erdModal) erdModal.style.display = 'none';
    });

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      tableModal.style.display = 'none';
    });

    tableModal.addEventListener('click', (e) => {
      if (e.target === tableModal) tableModal.style.display = 'none';
    });

    function typewriter(el, text) {
      return new Promise(resolve => {
        if (!text) { resolve(); return; }
        let i = 0;
        const charsPerFrame = Math.max(1, Math.ceil(text.length / 200)); // ~3s at 60fps
        function frame() {
          i = Math.min(i + charsPerFrame, text.length);
          el.textContent = text.slice(0, i);
          chatWindow.scrollTop = chatWindow.scrollHeight;
          if (i < text.length) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    const SVG_COPY = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const SVG_CHECK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const SVG_DOWNLOAD = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

    // ADR 0003: 서버가 xlsx 생성·저장, 응답의 downloadUrl 로 브라우저가 다운로드 트리거.
    // 라이브 메시지에서만 호출됨 (복원 메시지는 Export 칩 사용). bubble.dataset.messageId 는
    // assistant-saved SSE 이벤트가 세팅.
    async function exportToExcel(requestId, bubble) {
      try {
        const res = await fetch('/db-export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requestId,
            sessionId: state.currentSessionId ?? undefined,
            messageId: bubble?.dataset.messageId || undefined,
          }),
        });
        const json = await res.json();
        if (!res.ok) { alert(json.error || '내보내기 실패'); return; }
        if (!json.downloadUrl) { alert('다운로드 링크를 받지 못했습니다.'); return; }

        window.location.href = json.downloadUrl;

        if (bubble && json.exportId) {
          renderExportChips(bubble, [{
            id: json.exportId,
            sessionId: state.currentSessionId,
            messageId: bubble.dataset.messageId || null,
            fileName: json.fileName,
            fileSize: json.fileSize,
            rowCount: json.rowCount,
          }]);
        }
        state.exportsBySessionId.delete(state.currentSessionId);
        await refreshSessions();
        renderSidebar();
      } catch (e) {
        alert('엑셀 내보내기 중 오류가 발생했습니다.');
      }
    }

    // ── 셀 포맷터 (columns[i].type 기반) ─────────────────────────────────────
    function fmtOid(v) {
      const s = typeof v === 'string' ? v : (v && v.$oid) || String(v);
      const short = s;
      return `<span class="cell-oid" title="${escapeHtml(s)}">${escapeHtml(short)}</span>`;
    }

    function fmtDate(v) {
      let d;
      if (v == null) return `<span class="cell-null">—</span>`;
      if (typeof v === 'number') d = new Date(v);
      else if (typeof v === 'string') d = new Date(v);
      else if (v.$date) d = new Date(typeof v.$date === 'string' ? v.$date : Number(v.$date.$numberLong));
      else return escapeHtml(String(v));
      if (isNaN(d.getTime())) return escapeHtml(String(v));
      const parts = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
      }).formatToParts(d);
      const get = (t) => parts.find(p => p.type === t)?.value ?? '';
      return `<span class="cell-mono">${get('year')}-${get('month')}-${get('day')} ${get('hour')}:${get('minute')}:${get('second')}</span>`;
    }

    // *Ts / *_ts / *_at 필드는 스키마 상 number 로 저장되지만 unix ms 타임스탬프이므로 date 로 렌더.
    function isTimestampKey(key) {
      if (!key) return false;
      const leaf = key.includes('.') ? key.split('.').pop() : key;
      return /(Ts|_ts|_at)$/i.test(leaf);
    }

    function looksLikeUnixMs(v) {
      const n = typeof v === 'number' ? v : Number(v);
      return Number.isFinite(n) && n >= 1e12 && n < 4e13;
    }

    function fmtDecimal(v) {
      if (v == null) return `<span class="cell-null">—</span>`;
      const raw = typeof v === 'object' && v.$numberDecimal ? v.$numberDecimal : String(v);
      const num = Number(raw);
      if (isNaN(num)) return escapeHtml(raw);
      return `<span class="cell-mono">${num.toLocaleString('ko-KR')}</span>`;
    }

    function fmtBool(v) {
      if (v === true) return `<span class="cell-bool-t">✓</span>`;
      if (v === false) return `<span class="cell-bool-f">✗</span>`;
      return `<span class="cell-null">—</span>`;
    }

    function fmtNested(v, kind) {
      if (v == null) return `<span class="cell-null">—</span>`;
      const label = kind === 'array'
        ? `▶ ${Array.isArray(v) ? v.length : 0}개 항목`
        : `▶ {...}`;
      const json = JSON.stringify(v, null, 2);
      const id = 'nj-' + Math.random().toString(36).slice(2, 9);
      return `<button type="button" class="cell-nested" data-target="${id}">${label}</button>`
        + `<div class="nested-json" id="${id}">${escapeHtml(json)}</div>`;
    }

    function renderCell(value, type, key) {
      if (value === null || value === undefined) return `<span class="cell-null">—</span>`;
      // 타임스탬프 힌트: schema type=number 지만 이름이 *Ts/*_at 이고 값이 unix ms 형태면 date
      if (isTimestampKey(key) && looksLikeUnixMs(value)) return fmtDate(value);
      const t = (type || 'unknown').toLowerCase();
      if (t === 'objectid') return fmtOid(value);
      if (t === 'date') return fmtDate(value);
      if (t === 'decimal128') return fmtDecimal(value);
      if (t === 'boolean') return fmtBool(value);
      if (t === 'array' || Array.isArray(value)) return fmtNested(value, 'array');
      if (t === 'object' || (typeof value === 'object')) return fmtNested(value, 'object');
      if (t === 'number') return `<span class="cell-mono">${escapeHtml(String(value))}</span>`;
      return escapeHtml(String(value));
    }

    function getNestedValue(obj, key) {
      if (!key.includes('.')) return obj[key];
      let cur = obj;
      for (const p of key.split('.')) {
        if (cur == null) return undefined;
        cur = cur[p];
      }
      return cur;
    }

    function renderResultData(bubble, payload, requestId) {
      const divider = document.createElement('hr');
      divider.className = 'result-divider';
      bubble.appendChild(divider);

      const container = document.createElement('div');
      container.className = 'result-data';

      // 상단 배지
      const badges = document.createElement('div');
      badges.className = 'result-badges';
      const countBadge = document.createElement('span');
      countBadge.className = 'badge';
      countBadge.textContent = `총 ${payload.count}건`;
      badges.appendChild(countBadge);
      if (typeof payload.dbTimeMs === 'number') {
        const t = document.createElement('span');
        t.className = 'badge';
        t.textContent = `DB ${(payload.dbTimeMs / 1000).toFixed(2)}s`;
        badges.appendChild(t);
      }
      if (payload.columnConfidence === 'partial') {
        const p = document.createElement('span');
        p.className = 'badge partial';
        const n = (payload.unmappedKeys || []).length;
        p.textContent = `일부 컬럼은 자동 매핑되지 않았습니다${n ? ` (${n}개)` : ''}`;
        badges.appendChild(p);
      }
      container.appendChild(badges);

      // 데이터 없음
      if (!payload.data || payload.data.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-card';
        empty.textContent = payload.message || '조회된 데이터가 없습니다.';
        container.appendChild(empty);
        bubble.appendChild(container);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return;
      }

      // 테이블
      const wrap = document.createElement('div');
      wrap.className = 'result-table-wrap';
      const table = document.createElement('table');
      table.className = 'result-table';

      const thead = document.createElement('thead');
      const trh = document.createElement('tr');
      const cols = payload.columns || [];
      for (const col of cols) {
        const th = document.createElement('th');
        if (col.source == null) th.classList.add('unmapped');
        th.title = `${col.key} · ${col.type}${col.source ? ` · ${col.source}` : ''}`;
        const label = document.createElement('span');
        label.textContent = col.label || col.key;
        const key = document.createElement('span');
        key.className = 'th-key';
        key.textContent = col.key;
        th.appendChild(label);
        th.appendChild(key);
        trh.appendChild(th);
      }
      thead.appendChild(trh);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const row of payload.data) {
        const tr = document.createElement('tr');
        for (const col of cols) {
          const td = document.createElement('td');
          const val = getNestedValue(row, col.key);
          td.innerHTML = renderCell(val, col.type, col.key);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      wrap.appendChild(table);
      container.appendChild(wrap);

      // nested JSON 토글
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.cell-nested');
        if (!btn) return;
        const el = container.querySelector(`#${btn.dataset.target}`);
        if (el) el.classList.toggle('open');
      });

      bubble.appendChild(container);

      // 복사·엑셀 버튼 — rows 를 그대로 복사(JSON)
      const copyText = JSON.stringify(payload.data, null, 2);
      addResultActions(bubble, copyText, requestId);

      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addResultActions(parentEl, text, requestId) {
      const actions = document.createElement('div');
      actions.className = 'result-actions';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.innerHTML = `${SVG_COPY} 복사`;
      copyBtn.onclick = async () => {
        await navigator.clipboard.writeText(text);
        copyBtn.innerHTML = `${SVG_CHECK} 복사됨`;
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.innerHTML = `${SVG_COPY} 복사`; copyBtn.classList.remove('copied'); }, 1500);
      };

      actions.appendChild(copyBtn);

      // 엑셀 버튼은 /db-export 가 requestId → 쿼리 재실행이라, 복원된 메시지(requestId 없음)엔 비활성.
      // 복원된 결과의 재다운로드는 Export 칩 사용. bubble (= parentEl) 을 넘겨 dataset.messageId 로 link.
      if (requestId) {
        const dlBtn = document.createElement('button');
        dlBtn.className = 'action-btn';
        dlBtn.innerHTML = `${SVG_DOWNLOAD} 엑셀`;
        dlBtn.onclick = () => exportToExcel(requestId, parentEl);
        actions.appendChild(dlBtn);
      }
      parentEl.appendChild(actions);
    }

    stopBtn.addEventListener('click', async () => {
      if (!currentRequestId) return;
      await fetch('/chat/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requestId: currentRequestId }),
      });
    });

    function appendBubble(role, html, isLoading = false) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const div = document.createElement('div');
      div.className = `bubble ${role}${isLoading ? ' loading' : ''}`;
      div.innerHTML = html;

      const time = document.createElement('div');
      time.className = 'bubble-time';
      time.textContent = new Date().toTimeString().slice(0, 8);

      wrapper.appendChild(div);
      wrapper.appendChild(time);
      chatWindow.appendChild(wrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatResponse(text) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      const limitSelect = document.getElementById('limit-select');
      const limitCustom = document.getElementById('limit-custom');
      const limit = limitSelect.value === 'custom'
        ? (parseInt(limitCustom.value, 10) || 20)
        : parseInt(limitSelect.value, 10);

      // 세션 준비: 활성 세션이 없거나 과거 Session 열람 중이면 자동 신규 생성 (에픽 #232 결정 요약 3번).
      const past = isViewingPast();
      if (!state.currentSessionId || past) {
        try {
          if (past) showToast('새 Session 을 시작합니다');
          await createNewSession(message);
        } catch {
          showToast('새 Session 생성 실패');
          return;
        }
      }

      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;
      stopBtn.style.display = 'block';
      currentRequestId = crypto.randomUUID();

      appendBubble('user', escapeHtml(message));

      const assistantWrapper = document.createElement('div');
      assistantWrapper.className = 'msg-wrapper assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble assistant progress';

      const assistantTime = document.createElement('div');
      assistantTime.className = 'bubble-time';

      assistantWrapper.appendChild(bubble);
      assistantWrapper.appendChild(assistantTime);
      chatWindow.appendChild(assistantWrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      let currentStep = null;
      let resultRendered = false;

      function nowHMS() {
        return new Date().toTimeString().slice(0, 8);
      }

      function addStep(text) {
        if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }

        currentStep = document.createElement('div');
        currentStep.className = 'progress-step';

        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        const timeSpan = document.createElement('span');
        timeSpan.className = 'step-time';
        timeSpan.textContent = nowHMS();
        const textSpan = document.createElement('span');

        currentStep.appendChild(spinner);
        currentStep.appendChild(timeSpan);
        currentStep.appendChild(textSpan);
        bubble.appendChild(currentStep);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        typewriter(textSpan, text);
      }

      function addLog(text) {
        const log = document.createElement('div');
        log.className = 'progress-log';
        bubble.appendChild(log);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        typewriter(log, text);
      }

      addStep('준비 중...');

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, requestId: currentRequestId, limit, sessionId: state.currentSessionId }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6);
            if (raw === '[DONE]') break;

            try {
              const event = JSON.parse(raw);
              if (event.type === 'progress') {
                addStep(event.message);
              } else if (event.type === 'log') {
                addLog(event.message);
              } else if (event.type === 'query') {
                // 구조화된 query 이벤트 — 상세 로그는 이미 별도 'log' 이벤트로 표시됨 (backward compat).
                // 여기서는 추가 렌더 없음. 필요 시 상단 배지 등 확장.
              } else if (event.type === 'result-data') {
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                assistantTime.textContent = nowHMS();
                renderResultData(bubble, event.data, currentRequestId);
                resultRendered = true;
              } else if (event.type === 'result') {
                // result-data 로 이미 렌더했거나 LLM 이 아무 텍스트도 안 만들었으면 스킵.
                const resultText = event.message ?? '';
                if (resultRendered || !resultText.trim()) {
                  if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                  assistantTime.textContent = nowHMS();
                  continue;
                }
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                const d1 = document.createElement('hr'); d1.className = 'result-divider'; bubble.appendChild(d1);
                const r1 = document.createElement('div'); r1.className = 'result-text'; bubble.appendChild(r1);
                assistantTime.textContent = nowHMS();
                const capturedRequestId = currentRequestId;
                const truncated = resultText.length > 3000;
                const displayText = truncated ? resultText.slice(0, 3000) + '\n...' : resultText;
                await typewriter(r1, displayText);
                if (truncated) {
                  const notice = document.createElement('div');
                  notice.className = 'truncate-notice';
                  notice.innerHTML = `${SVG_DOWNLOAD} 결과가 길어 일부만 표시됩니다. 전체 내용은 아래 엑셀 다운로드를 이용해주세요.`;
                  bubble.appendChild(notice);
                }
                addResultActions(bubble, resultText, capturedRequestId);
              } else if (event.type === 'cancelled') {
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                const d2 = document.createElement('hr'); d2.className = 'result-divider'; bubble.appendChild(d2);
                const r2 = document.createElement('div'); r2.className = 'result-text'; r2.textContent = event.message; bubble.appendChild(r2);
                assistantTime.textContent = nowHMS();
              } else if (event.type === 'error') {
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                const d3 = document.createElement('hr'); d3.className = 'result-divider'; bubble.appendChild(d3);
                const r3 = document.createElement('div'); r3.className = 'result-text'; r3.textContent = event.message; bubble.appendChild(r3);
                assistantTime.textContent = nowHMS();
              } else if (event.type === 'assistant-saved') {
                // 서버가 assistant 메시지 저장 완료 — 다운로드 버튼이 dataset.messageId 로 Export 를 link 함.
                if (event.data?.messageId) bubble.dataset.messageId = event.data.messageId;
              } else if (event.type === 'export-promoted') {
                // 10MB 상한 초과로 서버가 자동 Export 승격 — 라이브 버블에 📎 칩 즉시 렌더.
                const ep = event.data || {};
                renderExportChips(bubble, [{
                  id: ep.exportId,
                  sessionId: state.currentSessionId,
                  messageId: ep.messageId,
                  fileName: ep.fileName,
                  fileSize: ep.fileSize,
                  rowCount: ep.rowCount,
                }]);
              }
              chatWindow.scrollTop = chatWindow.scrollHeight;
            } catch (_) {}
          }
        }
      } catch (e) {
        if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
        const de = document.createElement('hr'); de.className = 'result-divider'; bubble.appendChild(de);
        const re = document.createElement('div'); re.className = 'result-text'; re.textContent = '서버와 통신 중 오류가 발생했습니다.'; bubble.appendChild(re);
        assistantTime.textContent = nowHMS();
      } finally {
        sendBtn.disabled = false;
        stopBtn.style.display = 'none';
        currentRequestId = null;
        userInput.focus();
        // 세션 updatedAt / 메타 갱신 (서버가 /chat 안에서 user·assistant 메시지 자동 저장 — ADR 0002).
        try {
          if (state.currentSessionId) {
            state.exportsBySessionId.delete(state.currentSessionId);
          }
          await refreshSessions();
          renderSidebar();
        } catch { /* 사이드바 갱신 실패해도 chat 흐름은 유지 */ }
      }
    }

    fetch('/meta').then(r => r.json()).then(data => {
      if (data.updatedAt) {
        document.getElementById('updated-at').textContent = '최종 업데이트: ' + data.updatedAt;
      }
    });

    document.getElementById('limit-select').addEventListener('change', (e) => {
      const customInput = document.getElementById('limit-custom');
      customInput.style.display = e.target.value === 'custom' ? '' : 'none';
      if (e.target.value === 'custom') customInput.focus();
    });

    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
