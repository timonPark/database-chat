<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude MySQL Chat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 20px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header-left .updated-at {
      font-size: 0.72rem;
      color: #5a7fa0;
      margin-top: 2px;
    }

    #table-info-btn {
      padding: 5px 14px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
      background: transparent;
      color: #7ab3e0;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    #table-info-btn:hover { background: #1a3a5a; color: #b0d4f0; }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 12px;
      width: min(780px, 94vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #0f3460;
      font-size: 0.95rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: #5a7fa0;
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-close:hover { color: #e0e0e0; background: #2a3a5a; }

    .modal-search {
      flex-shrink: 0;
      padding: 10px 20px;
      border-bottom: 1px solid #0f3460;
      background: #16213e;
    }

    .modal-search input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #2a4a6a;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.85rem;
      outline: none;
    }

    .modal-search input:focus { border-color: #4a90d9; }

    .modal-no-result {
      padding: 20px;
      text-align: center;
      color: #4a7a9b;
      font-size: 0.85rem;
    }

    .modal-body {
      overflow-y: auto;
      padding: 20px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .modal-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
    }

    .modal-body th, .modal-body td {
      border: 1px solid #2a3a5a;
      padding: 7px 12px;
      text-align: left;
    }

    .modal-body th {
      background: #1a2a4a;
      color: #a0c4e0;
      font-weight: 600;
    }

    .modal-body tr:nth-child(even) td { background: #1a1f35; }

    .modal-body code {
      background: #0f1a2e;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.82rem;
      color: #7ab3e0;
    }

    .modal-body h1, .modal-body h2, .modal-body h3 {
      color: #a0c4e0;
      margin: 14px 0 6px;
    }

    .modal-body p { margin: 6px 0; }

    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-wrapper {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .msg-wrapper.user { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble-time {
      font-size: 0.70rem;
      color: #4a7a9b;
      font-family: monospace;
      padding: 0 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      width: 100%;
    }

    .bubble.user {
      background: #0f3460;
      border-bottom-right-radius: 4px;
      color: #ddeeff;
    }

    .bubble.assistant {
      background: #2a2a3e;
      border-bottom-left-radius: 4px;
      color: #e0e0e0;
    }

    .bubble.progress {
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      white-space: normal;
    }

    .progress-step {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #7ab3e0;
    }

    .progress-step .step-time {
      font-family: monospace;
      font-size: 0.75rem;
      color: #4a7a9b;
      flex-shrink: 0;
    }

    .progress-step.done {
      color: #5a8a5a;
    }

    .progress-step .spinner {
      width: 10px;
      height: 10px;
      border: 2px solid #4a90d9;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    .progress-step.done .spinner {
      border: none;
      animation: none;
      width: 10px;
      text-align: center;
    }

    .progress-step.done .spinner::after {
      content: '✓';
      font-size: 0.8rem;
      color: #5a8a5a;
    }

    .progress-log {
      margin-left: 17px;
      background: #1a1a2e;
      border-left: 2px solid #0f3460;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.78rem;
      color: #8899bb;
      white-space: pre;
      overflow-x: auto;
    }

    .result-divider {
      border: none;
      border-top: 1px solid #2a3a5a;
      margin: 6px 0 4px;
    }

    .result-text {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #e0e0e0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .truncate-notice {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 6px;
      background: #1e2d1e;
      border: 1px solid #3a5a3a;
      color: #7ab87a;
      font-size: 0.78rem;
    }

    .result-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border: 1px solid #2a3a5a;
      border-radius: 6px;
      background: transparent;
      color: #5a7fa0;
      cursor: pointer;
      font-size: 0.75rem;
      transition: color 0.15s, border-color 0.15s;
    }

    .action-btn:hover { color: #a0c4e0; border-color: #4a7a9b; }
    .action-btn.copied { color: #5a8a5a; border-color: #5a8a5a; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #input-area {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 16px 12px;
      background: #16213e;
      border-top: 1px solid #0f3460;
      position: sticky;
      bottom: 0;
    }

    #limit-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #limit-label {
      font-size: 0.75rem;
      color: #4a7a9b;
    }

    #limit-select {
      background: #1a1a2e;
      border: 1px solid #1a3a5a;
      border-radius: 6px;
      color: #7ab3e0;
      font-size: 0.75rem;
      padding: 3px 8px;
      outline: none;
      cursor: pointer;
    }

    #limit-select:focus { border-color: #4a90d9; }

    #limit-custom {
      width: 72px;
      background: #1a1a2e;
      border: 1px solid #1a3a5a;
      border-radius: 6px;
      color: #7ab3e0;
      font-size: 0.75rem;
      padding: 3px 8px;
      outline: none;
    }

    #limit-custom:focus { border-color: #4a90d9; }

    #input-row {
      display: flex;
      gap: 8px;
    }

    #input-row #user-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 22px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 0.92rem;
      outline: none;
      resize: none;
      line-height: 1.4;
      max-height: 120px;
      overflow-y: auto;
    }

    #input-row #user-input:focus { border-color: #4a90d9; }

    #send-btn {
      padding: 0 18px;
      border-radius: 22px;
      border: none;
      background: #4a90d9;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { background: #357abd; }
    #send-btn:disabled { background: #2a4a6a; cursor: not-allowed; }

    #stop-btn {
      padding: 0 18px;
      border-radius: 22px;
      border: none;
      background: #8b2020;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
      display: none;
    }

    #stop-btn:hover { background: #a83232; }

    @media (max-width: 480px) {
      .msg-wrapper { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Claude MySQL Chat</h1>
      <div class="updated-at" id="updated-at"></div>
    </div>
    <button id="table-info-btn">테이블 정보</button>
  </header>

  <div id="table-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <span>테이블 정보</span>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-search">
        <input type="text" id="modal-search-input" placeholder="컬렉션명 또는 설명으로 검색...">
      </div>
      <div class="modal-body" id="modal-content"></div>
    </div>
  </div>

  <div id="chat-window"></div>

  <div id="input-area">
    <div id="limit-row">
      <span id="limit-label">최대 조회 건수</span>
      <select id="limit-select">
        <option value="20">20건</option>
        <option value="50">50건</option>
        <option value="100">100건</option>
        <option value="200">200건</option>
        <option value="500">500건</option>
        <option value="custom">직접 입력</option>
      </select>
      <input type="number" id="limit-custom" min="1" placeholder="건수" style="display:none">
    </div>
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="자연어로 데이터를 조회하세요..."></textarea>
      <button id="stop-btn">중지</button>
      <button id="send-btn">전송</button>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const stopBtn = document.getElementById('stop-btn');

    let currentRequestId = null;

    // 테이블 정보 모달
    const tableModal = document.getElementById('table-modal');
    const modalContent = document.getElementById('modal-content');
    const modalSearchInput = document.getElementById('modal-search-input');

    function filterModalRows(q) {
      const term = q.trim().toLowerCase();

      // 모든 요소 초기화
      modalContent.querySelectorAll('table, tr, h1, h2, h3, h4, p, hr')
        .forEach(el => el.style.display = '');

      const noResult = modalContent.querySelector('.modal-no-result');
      if (!term) {
        if (noResult) noResult.style.display = 'none';
        return;
      }

      let totalVisible = 0;

      modalContent.querySelectorAll('table').forEach(table => {
        const rows = table.querySelectorAll('tbody tr');
        let visibleCount = 0;
        rows.forEach(row => {
          const match = row.textContent.toLowerCase().includes(term);
          row.style.display = match ? '' : 'none';
          if (match) visibleCount++;
        });

        // 매칭 행이 없으면 테이블과 앞쪽 제목/단락도 숨김
        if (visibleCount === 0) {
          table.style.display = 'none';
          let el = table.previousElementSibling;
          while (el && el.tagName !== 'TABLE') {
            el.style.display = 'none';
            el = el.previousElementSibling;
          }
        } else {
          totalVisible += visibleCount;
        }
      });

      let nr = modalContent.querySelector('.modal-no-result');
      if (totalVisible === 0) {
        if (!nr) {
          nr = document.createElement('div');
          nr.className = 'modal-no-result';
          modalContent.appendChild(nr);
        }
        nr.textContent = `"${q}" 에 해당하는 컬렉션이 없습니다.`;
        nr.style.display = '';
      } else if (nr) {
        nr.style.display = 'none';
      }
    }

    document.getElementById('table-info-btn').addEventListener('click', async () => {
      if (!modalContent.innerHTML) {
        const res = await fetch('/meta/table-info');
        const { content } = await res.json();
        modalContent.innerHTML = marked.parse(content);
      }
      modalSearchInput.value = '';
      filterModalRows('');
      tableModal.style.display = 'flex';
      modalSearchInput.focus();
    });

    modalSearchInput.addEventListener('input', (e) => filterModalRows(e.target.value));

    document.getElementById('modal-close-btn').addEventListener('click', () => {
      tableModal.style.display = 'none';
    });

    tableModal.addEventListener('click', (e) => {
      if (e.target === tableModal) tableModal.style.display = 'none';
    });

    function typewriter(el, text) {
      return new Promise(resolve => {
        if (!text) { resolve(); return; }
        let i = 0;
        const charsPerFrame = Math.max(1, Math.ceil(text.length / 200)); // ~3s at 60fps
        function frame() {
          i = Math.min(i + charsPerFrame, text.length);
          el.textContent = text.slice(0, i);
          chatWindow.scrollTop = chatWindow.scrollHeight;
          if (i < text.length) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });
    }

    const SVG_COPY = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const SVG_CHECK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
    const SVG_DOWNLOAD = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

    async function exportToExcel(requestId) {
      try {
        const res = await fetch('/db-export', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId }),
        });
        const json = await res.json();
        if (!res.ok) { alert(json.error || '내보내기 실패'); return; }
        if (!json.data || json.data.length === 0) { alert('다운로드할 데이터가 없습니다.'); return; }

        // 중첩 객체·배열은 JSON 문자열로 평탄화
        const rows = json.data.map(doc => {
          const flat = {};
          for (const [k, v] of Object.entries(doc)) {
            flat[k] = (v !== null && typeof v === 'object') ? JSON.stringify(v) : v;
          }
          return flat;
        });

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '조회결과');
        const ts = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
        const collectionName = json.collection || '조회결과';
        XLSX.writeFile(wb, `${collectionName}_${ts}.xlsx`);
      } catch (e) {
        alert('엑셀 내보내기 중 오류가 발생했습니다.');
      }
    }

    function addResultActions(parentEl, text, requestId) {
      const actions = document.createElement('div');
      actions.className = 'result-actions';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.innerHTML = `${SVG_COPY} 복사`;
      copyBtn.onclick = async () => {
        await navigator.clipboard.writeText(text);
        copyBtn.innerHTML = `${SVG_CHECK} 복사됨`;
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.innerHTML = `${SVG_COPY} 복사`; copyBtn.classList.remove('copied'); }, 1500);
      };

      const dlBtn = document.createElement('button');
      dlBtn.className = 'action-btn';
      dlBtn.innerHTML = `${SVG_DOWNLOAD} 엑셀`;
      dlBtn.onclick = () => exportToExcel(requestId);

      actions.appendChild(copyBtn);
      actions.appendChild(dlBtn);
      parentEl.appendChild(actions);
    }

    stopBtn.addEventListener('click', async () => {
      if (!currentRequestId) return;
      await fetch('/chat/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requestId: currentRequestId }),
      });
    });

    function appendBubble(role, html, isLoading = false) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const div = document.createElement('div');
      div.className = `bubble ${role}${isLoading ? ' loading' : ''}`;
      div.innerHTML = html;

      const time = document.createElement('div');
      time.className = 'bubble-time';
      time.textContent = new Date().toTimeString().slice(0, 8);

      wrapper.appendChild(div);
      wrapper.appendChild(time);
      chatWindow.appendChild(wrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatResponse(text) {
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      const limitSelect = document.getElementById('limit-select');
      const limitCustom = document.getElementById('limit-custom');
      const limit = limitSelect.value === 'custom'
        ? (parseInt(limitCustom.value, 10) || 20)
        : parseInt(limitSelect.value, 10);

      userInput.value = '';
      userInput.style.height = 'auto';
      sendBtn.disabled = true;
      stopBtn.style.display = 'block';
      currentRequestId = crypto.randomUUID();

      appendBubble('user', escapeHtml(message));

      const assistantWrapper = document.createElement('div');
      assistantWrapper.className = 'msg-wrapper assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble assistant progress';

      const assistantTime = document.createElement('div');
      assistantTime.className = 'bubble-time';

      assistantWrapper.appendChild(bubble);
      assistantWrapper.appendChild(assistantTime);
      chatWindow.appendChild(assistantWrapper);
      chatWindow.scrollTop = chatWindow.scrollHeight;

      let currentStep = null;

      function nowHMS() {
        return new Date().toTimeString().slice(0, 8);
      }

      function addStep(text) {
        if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }

        currentStep = document.createElement('div');
        currentStep.className = 'progress-step';

        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        const timeSpan = document.createElement('span');
        timeSpan.className = 'step-time';
        timeSpan.textContent = nowHMS();
        const textSpan = document.createElement('span');

        currentStep.appendChild(spinner);
        currentStep.appendChild(timeSpan);
        currentStep.appendChild(textSpan);
        bubble.appendChild(currentStep);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        typewriter(textSpan, text);
      }

      function addLog(text) {
        const log = document.createElement('div');
        log.className = 'progress-log';
        bubble.appendChild(log);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        typewriter(log, text);
      }

      addStep('준비 중...');

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, requestId: currentRequestId, limit }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6);
            if (raw === '[DONE]') break;

            try {
              const event = JSON.parse(raw);
              if (event.type === 'progress') {
                addStep(event.message);
              } else if (event.type === 'log') {
                addLog(event.message);
              } else if (event.type === 'result') {
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                const d1 = document.createElement('hr'); d1.className = 'result-divider'; bubble.appendChild(d1);
                const r1 = document.createElement('div'); r1.className = 'result-text'; bubble.appendChild(r1);
                assistantTime.textContent = nowHMS();
                const resultText = event.message;
                const capturedRequestId = currentRequestId;
                const truncated = resultText.length > 3000;
                const displayText = truncated ? resultText.slice(0, 3000) + '\n...' : resultText;
                await typewriter(r1, displayText);
                if (truncated) {
                  const notice = document.createElement('div');
                  notice.className = 'truncate-notice';
                  notice.innerHTML = `${SVG_DOWNLOAD} 결과가 길어 일부만 표시됩니다. 전체 내용은 아래 엑셀 다운로드를 이용해주세요.`;
                  bubble.appendChild(notice);
                }
                addResultActions(bubble, resultText, capturedRequestId);
              } else if (event.type === 'cancelled') {
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                const d2 = document.createElement('hr'); d2.className = 'result-divider'; bubble.appendChild(d2);
                const r2 = document.createElement('div'); r2.className = 'result-text'; r2.textContent = event.message; bubble.appendChild(r2);
                assistantTime.textContent = nowHMS();
              } else if (event.type === 'error') {
                if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
                const d3 = document.createElement('hr'); d3.className = 'result-divider'; bubble.appendChild(d3);
                const r3 = document.createElement('div'); r3.className = 'result-text'; r3.textContent = event.message; bubble.appendChild(r3);
                assistantTime.textContent = nowHMS();
              }
              chatWindow.scrollTop = chatWindow.scrollHeight;
            } catch (_) {}
          }
        }
      } catch (e) {
        if (currentStep) { currentStep.querySelector('.spinner').className = 'spinner'; currentStep.classList.add('done'); }
        const de = document.createElement('hr'); de.className = 'result-divider'; bubble.appendChild(de);
        const re = document.createElement('div'); re.className = 'result-text'; re.textContent = '서버와 통신 중 오류가 발생했습니다.'; bubble.appendChild(re);
        assistantTime.textContent = nowHMS();
      } finally {
        sendBtn.disabled = false;
        stopBtn.style.display = 'none';
        currentRequestId = null;
        userInput.focus();
      }
    }

    fetch('/meta').then(r => r.json()).then(data => {
      if (data.updatedAt) {
        document.getElementById('updated-at').textContent = '최종 업데이트: ' + data.updatedAt;
      }
    });

    document.getElementById('limit-select').addEventListener('change', (e) => {
      const customInput = document.getElementById('limit-custom');
      customInput.style.display = e.target.value === 'custom' ? '' : 'none';
      if (e.target.value === 'custom') customInput.focus();
    });

    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
